<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Card 3D do treino</title><style>
@font-face{font-family:"SoraL";font-weight:700;src:url("../../node_modules/@expo-google-fonts/sora/700Bold/Sora_700Bold.ttf")}
@font-face{font-family:"SoraL";font-weight:600;src:url("../../node_modules/@expo-google-fonts/sora/600SemiBold/Sora_600SemiBold.ttf")}
@font-face{font-family:"ManropeL";font-weight:700;src:url("../../node_modules/@expo-google-fonts/manrope/700Bold/Manrope_700Bold.ttf")}
@font-face{font-family:"ManropeL";font-weight:600;src:url("../../node_modules/@expo-google-fonts/manrope/600SemiBold/Manrope_600SemiBold.ttf")}
:root{--ground:#050506;--ink:#F4F5F0;--ink2:rgba(244,245,240,.66);--ink3:rgba(244,245,240,.42);--lime:#D1FB39;--limeTint:rgba(209,251,57,.16);--limeEdge:rgba(209,251,57,.38);--glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.06);--edge:rgba(255,255,255,.12);--edgeTop:rgba(255,255,255,.30);--line:rgba(255,255,255,.14);--soft:rgba(255,255,255,.07);--track:rgba(255,255,255,.10);--display:"SoraL",system-ui;--body:"ManropeL",system-ui}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--ink);font-family:var(--body)}
.ph{width:390px;height:700px;background:var(--ground);position:relative;overflow:hidden;isolation:isolate}
.ph::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(95% 42% at 85% 8%,rgba(209,251,57,.08),transparent 70%)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:54px 16px 0}
.av{width:44px;height:44px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--lime),#2ED3A0)}.av b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#0b0c0a;font-family:var(--display)}
.acts{display:flex;gap:8px}.acts span{height:40px;min-width:40px;padding:0 12px;border-radius:20px;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px}
.tt{padding:14px 16px 0}.tt h2{margin:0;font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.035em}.tt small{font-size:13px;color:var(--ink3)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 12px 0}.wk div{display:grid;justify-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink3)}.wk b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-family:var(--display);font-size:14px;color:var(--ink2)}.wk .h{color:var(--ink)}.wk .h b{box-shadow:inset 0 0 0 2px var(--lime);color:var(--ink)}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.zona{position:relative;margin:0 10px}
/* cartão */
.card{position:absolute;left:0;right:0;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02) 45%,rgba(255,255,255,.015)),rgba(14,14,17,.92);border:1px solid var(--edge);border-top-color:var(--edgeTop)}
.luz{position:absolute;inset:-1px;pointer-events:none;overflow:visible}
.corpo{position:absolute;pointer-events:none;mix-blend-mode:lighten;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 97%);mask-image:linear-gradient(180deg,#000 72%,transparent 97%);background:url(ref-corpo-3d.png) no-repeat center top/contain}
.halo{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(209,251,57,.22),rgba(209,251,57,.06) 55%,transparent);pointer-events:none}
.aneis{position:absolute;border-radius:50%;border:1px solid rgba(209,251,57,.10);pointer-events:none}
.rot{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.rot i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px rgba(209,251,57,.8)}
h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.verde{background:linear-gradient(180deg,#E6FF7A,#B8EC1E);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 8px;border-radius:14px;background:var(--limeTint);border:1px solid var(--limeEdge);color:var(--lime);font-size:12px;font-weight:700}
.tag svg{width:15px;height:15px}
.btn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px 0 7px;border-radius:22px;background:rgba(22,23,26,.9);border:1.5px solid rgba(209,251,57,.75);box-shadow:0 0 18px -6px rgba(209,251,57,.55);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em}
.btn span{width:30px;height:30px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
/* card do timer */
.t-rot{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--ink3)}
.t-rot i{width:6px;height:6px;border-radius:3px;background:var(--lime)}
.tracos{display:flex;gap:5px;margin-top:12px}.tracos i{flex:1;height:5px;border-radius:3px;background:var(--track)}
.neon{display:flex;align-items:center;justify-content:center;height:54px;border-radius:27px;border:1.5px solid rgba(209,251,57,.7);background:rgba(22,23,26,.78);font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.18em;box-shadow:0 0 18px -8px rgba(209,251,57,.5)}
.redondo{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center}
.seg{display:flex;margin:0 16px;padding:4px;border-radius:22px;background:rgba(20,20,23,.8);border:1px solid rgba(255,255,255,.1)}.seg span{flex:1;height:34px;border-radius:17px;display:grid;place-items:center;font-size:13px;font-weight:700}.seg span.on{background:var(--ink);color:#101113}
</style></head><body>
<div class="ph" id="tela">
  <div class="hdr"><div class="av"><b>L</b></div><div class="acts"><span>🔥 3</span><span>🔔</span></div></div>
  <div class="tt"><h2>Treino</h2><small>Meu treino · 5 dias por semana</small></div>
  <div class="wk"><div>SEG<b>29</b></div><div>TER<b>30</b></div><div>QUA<b>01</b></div><div>QUI<b>02</b></div><div class="h">SEX<b>03</b></div><div>SÁB<b>04</b></div><div>DOM<b>05</b></div></div>
  <div class="kick" style="margin:22px 16px 0" id="kick">Sexta-feira</div>
  <div class="zona" id="zona" style="height:330px;margin-top:10px">
    <div class="card" id="card" style="top:40px;height:272px">
      <svg class="luz" id="luz"></svg>
      <!-- lado do treino do dia -->
      <div id="hoje" style="position:absolute;inset:0">
        <div class="aneis" id="an1"></div><div class="aneis" id="an2"></div>
        <div style="position:relative;padding:26px 0 0 20px;width:58%">
          <div class="rot"><i></i>4 exercícios · 13 séries</div>
          <h3 style="font-size:24px;margin-top:12px">Costas, bíceps e <span class="verde">trapézio</span></h3>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px">
            <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 6c2 3 3 8 6 13M18 6c-2 3-3 8-6 13"/></svg>Costas</span>
            <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18c3 1 8 1 11-2 2-2 3-5 1-8-1-2-4-2-5 0l-2 3M5 18l-1-6"/></svg>Bíceps</span>
            <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-8 7h16zM12 4v15"/></svg>Trapézio</span>
          </div>
        </div>
        <div style="position:absolute;left:20px;bottom:18px" id="btn"><div class="btn"><span><svg width="12" height="12" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#152000"/></svg></span>INICIAR TREINO</div></div>
      </div>
      <!-- lado do timer -->
      <div id="timer" style="position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 20px;opacity:0">
        <div style="flex:1;min-width:0">
          <div class="t-rot"><i></i>AGORA</div>
          <div style="font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.02em;margin-top:6px">Puxada frontal aberta</div>
          <div style="font-size:12px;font-weight:600;color:var(--ink3);margin-top:3px">Série 1 de 4 · 40 kg × 12</div>
          <div class="tracos"><i style="background:var(--lime)"></i><i></i><i></i><i></i></div>
        </div>
        <div style="width:1px;align-self:stretch;margin:18px 0;background:var(--soft)"></div>
        <div style="font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.05em" id="relogio">0:00</div>
      </div>
    </div>
    <div class="halo" id="halo"></div>
    <div id="corpoClip" style="position:absolute;left:0;right:0;top:-60px;bottom:0;overflow:hidden;pointer-events:none">
      <div class="corpo" id="corpo"></div>
    </div>
    <div id="controles" style="position:absolute;left:6px;right:6px;display:flex;gap:10px;opacity:0">
      <div class="neon" style="flex:1">CONCLUIR SÉRIE</div><div class="redondo"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="#F4F5F0"/></svg></div>
    </div>
  </div>
  <div class="seg" id="seg" style="margin-top:14px"><span class="on">Exercícios</span><span>Cardio</span><span>Semana</span></div>
</div>
<script>
// Linha do tempo da troca, controlada por t (ms) para dar para gravar quadro a quadro.
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);          // desacelera
const easeIn=x=>Math.pow(clamp(x),2.2);
const mix=(a,b,k)=>a+(b-a)*k;
const W=370;
const H0=272, H1=112;           // altura do card do dia e do card do timer
const TOP0=40, TOP1=4;
function contorno(w,h,r,m){const x0=m,y0=m,x1=w-m,y1=h-m;return {d:`M${x0+r} ${y0}H${x1-r}A${r} ${r} 0 0 1 ${x1} ${y0+r}V${y1-r}A${r} ${r} 0 0 1 ${x1-r} ${y1}H${x0+r}A${r} ${r} 0 0 1 ${x0} ${y1-r}V${y0+r}A${r} ${r} 0 0 1 ${x0+r} ${y0}Z`,p:2*(x1-x0+y1-y0)-8*r+2*Math.PI*r};}
// Quatro luzes saindo do meio de cima e do meio de baixo, correndo por dentro da linha até se encontrarem no meio das laterais (o efeito do botão).
function luzes(w,h,k,forca){
  const r=27,m=1.2;const cx=w/2;
  const seg=(pts)=>`<path d="${pts}" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" opacity="${forca}"/>`;
  // caminhos do meio de cima até o meio da lateral (os dois lados) e do meio de baixo até o meio da lateral
  const topoDir=`M${cx} ${m}H${w-m-r}A${r} ${r} 0 0 1 ${w-m} ${m+r}V${h/2}`;
  const topoEsq=`M${cx} ${m}H${m+r}A${r} ${r} 0 0 0 ${m} ${m+r}V${h/2}`;
  const baixoDir=`M${cx} ${h-m}H${w-m-r}A${r} ${r} 0 0 0 ${w-m} ${h-m-r}V${h/2}`;
  const baixoEsq=`M${cx} ${h-m}H${m+r}A${r} ${r} 0 0 1 ${m} ${h-m-r}V${h/2}`;
  const L=(w/2-r)+Math.PI*r/2+(h/2-r);const cauda=L*0.28;const cabeca=k*(L+cauda);
  const dash=`stroke-dasharray="${cauda} ${L*3}" stroke-dashoffset="${-(cabeca-cauda)}"`;
  const p=d=>`<path d="${d}" fill="none" stroke="#D1FB39" stroke-width="2.4" stroke-linecap="round" ${dash} opacity="${forca}" filter="url(#bl)"/><path d="${d}" fill="none" stroke="#F4FFB8" stroke-width="1.2" stroke-linecap="round" ${dash} opacity="${forca}"/>`;
  return `<defs><filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>`+p(topoDir)+p(topoEsq)+p(baixoDir)+p(baixoEsq);
}
function render(t){
  // fase 1 (0–1600): o card parado, as luzes correndo uma vez, devagar
  // toque em 1900; fase 2 (1900–2350): o corpo sobe e some, o texto sai para a esquerda
  // fase 3 (2250–2750): o card encolhe até o tamanho do timer; fase 4 (2650–3150): entra o conteúdo do timer, a linha verde começa no canto e os botões sobem
  const luzK=clamp((t-200)/1800);
  const toque=t>=1900&&t<2050?1:0;
  const sai=ease((t-1950)/450), encolhe=ease((t-2250)/520), entra=ease((t-2650)/480);
  const H=mix(H0,H1,encolhe), TOP=mix(TOP0,TOP1,encolhe);
  const card=$('card');card.style.height=H+'px';card.style.top=TOP+'px';
  card.style.transform=`scale(${toque?0.985:1})`;
  // luz do card
  const c=contorno(W,H,27,1.2);
  const volta=entra*0.35; // a linha verde do timer nasce no canto e começa a correr
  $('luz').setAttribute('width',W);$('luz').setAttribute('height',H);
  $('luz').innerHTML=(t<2250?luzes(W,H,luzK,1-sai):'')+
    `<path d="${c.d}" fill="none" stroke="rgba(209,251,57,${0.55*(1-sai)})" stroke-width="1.2"/>`+
    (entra>0?`<path d="${c.d}" fill="none" stroke="#D1FB39" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${c.p} ${c.p}" stroke-dashoffset="${c.p*(1-Math.max(.002,volta))}" opacity="${entra}"/>`:'');
  // conteúdo do dia
  $('hoje').style.opacity=1-sai;$('hoje').style.transform=`translateX(${-24*sai}px)`;
  $('btn').style.transform=`scale(${toque?0.95:1})`;
  // corpo: sai da borda de cima do card; na troca sobe e some
  const bw=236,bh=bw*852/766;
  const corpo=$('corpo');corpo.style.width=bw+'px';corpo.style.height=bh+'px';
  corpo.style.right='-34px';corpo.style.left='auto';corpo.style.top=(TOP0-26+60)+'px';
  corpo.style.opacity=1-easeIn((t-1950)/380);
  corpo.style.transform=`translateY(${-40*ease((t-1950)/420)}px) scale(${1+0.08*ease((t-1950)/420)})`;
  $('corpoClip').style.bottom=(330-(TOP+H))+'px';
  const halo=$('halo');halo.style.width='240px';halo.style.height='240px';halo.style.right='-40px';halo.style.top=(TOP0+10)+'px';halo.style.opacity=(1-sai)*(0.85+0.15*Math.sin(t/500));
  for (const [id,s] of [['an1',230],['an2',300]]){const a=$(id);a.style.width=a.style.height=s+'px';a.style.right=(-s/2+70)+'px';a.style.top=(H0/2-s/2+10)+'px';}
  // timer
  $('timer').style.opacity=entra;$('timer').style.transform=`translateY(${10*(1-entra)}px)`;
  $('relogio').textContent='0:0'+Math.floor(clamp((t-2650)/1000)*3);
  const ctl=$('controles');ctl.style.top=(TOP+H+14)+'px';ctl.style.opacity=ease((t-2800)/420);ctl.style.transform=`translateY(${16*(1-ease((t-2800)/420))}px)`;
  $('kick').style.opacity=1-sai*0.0;
  $('seg').style.transform=`translateY(${mix(0,-40,encolhe)+mix(0,68,ease((t-2800)/420))}px)`;
}
window.render=render;render(Number(new URLSearchParams(location.search).get('t')||1200));
</script></body></html>
